[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/contracts",
    "crates/persistence",
    "crates/providers",
    "crates/jobs",
    "crates/security",
    "crates/test-support",
    "services/api",
    "services/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92.0"
license = "Apache-2.0"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
jsonschema = { version = "0.29", default-features = false }
axum = "0.8"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

curriculum-domain = { path = "crates/domain" }
curriculum-application = { path = "crates/application" }
curriculum-contracts = { path = "crates/contracts" }
curriculum-persistence = { path = "crates/persistence" }
curriculum-providers = { path = "crates/providers" }
curriculum-jobs = { path = "crates/jobs" }
curriculum-security = { path = "crates/security" }
curriculum-test-support = { path = "crates/test-support" }
