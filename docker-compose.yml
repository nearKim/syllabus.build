services:
  postgres:
    image: postgres:16-alpine
    container_name: syllabus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syllabus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syllabus}
      POSTGRES_DB: ${POSTGRES_DB:-syllabus_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./crates/persistence/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-syllabus} -d $${POSTGRES_DB:-syllabus_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
