          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        activity_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        status:
          type: string
          enum:
          - not_scheduled
          - scheduled
          - due
          - deferred
        due_at:
          anyOf:
          - type: string
            minLength: 20
            maxLength: 40
            format: date-time
          - type: 'null'
        interval_policy_version:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
      required:
      - review_item_id
      - objective_id
      - activity_id
      - status
      - due_at
      - interval_policy_version
      additionalProperties: false
    SchedulePatch:
      type: object
      properties:
        timezone:
          type: string
          minLength: 3
          maxLength: 100
          description: IANA timezone identifier. The application must validate it
            against its supported timezone database.
        weekly_minutes:
          type: integer
          minimum: 30
          maximum: 2400
        unavailable_dates:
          type: array
          items:
            type: string
            minLength: 10
            maxLength: 10
            format: date
          minItems: 0
          maxItems: 366
          uniqueItems: true
        session_changes:
          type: array
          items:
            oneOf:
            - type: object
              properties:
                session_id:
                  type: string
                  minLength: 3
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
                action:
                  const: move
                requested_start_at:
                  type: string
                  minLength: 20
                  maxLength: 40
                  format: date-time
              required:
              - session_id
              - action
              - requested_start_at
              additionalProperties: false
            - type: object
              properties:
                session_id:
                  type: string
                  minLength: 3
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
                action:
                  const: cancel
              required:
              - session_id
              - action
              additionalProperties: false
          minItems: 0
          maxItems: 200
      required: []
      additionalProperties: false
      minProperties: 1
      description: A typed patch request, not arbitrary JSON Patch. The scheduler
        owns committed dates and creates a new revision. RFC 3339 timestamps must
        match the effective IANA zone; reject ambiguous or invalid time requests rather
        than guessing.
    CredentialCreate:
      type: object
      properties:
        provider_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        label:
          type: string
          minLength: 1
          maxLength: 120
        api_key:
          type: string
          minLength: 8
          maxLength: 16384
          writeOnly: true
        custody_disclosure_version:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        accept_server_storage:
          const: true
      required:
      - provider_id
      - label
      - api_key
      - custody_disclosure_version
      - accept_server_storage
      additionalProperties: false
      description: Approved provider registry IDs only; custom base URLs are excluded
        from this draft. The API key is write-only, redacted from logs and error bodies,
        and never returned.
    CredentialMetadata:
      type: object
      properties:
        credential_ref:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        provider_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        label:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum:
          - unverified
          - valid
          - invalid
          - revoked
        created_at:
          type: string
          minLength: 20
          maxLength: 40
          format: date-time
        last_validated_at:
          anyOf:
          - type: string
            minLength: 20
            maxLength: 40
            format: date-time
          - type: 'null'
        credential_version_ref:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        custody_mode:
          const: server_encrypted
        masked_suffix:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 8
          - type: 'null'
      required:
      - credential_ref
      - provider_id
      - label
      - status
      - created_at
      - last_validated_at
      - credential_version_ref
      - custody_mode
      - masked_suffix
      additionalProperties: false
    NotificationPreferences:
      type: object
      properties:
        version:
          type: integer
          minimum: 0
        enabled:
          type: boolean
        channels:
          type: array
          items:
            type: string
            enum:
            - in_app
            - email
            - push
          minItems: 0
          maxItems: 3
          uniqueItems: true
        quiet_hours:
          anyOf:
          - type: object
            properties:
              start_local:
                type: string
                minLength: 5
                maxLength: 5
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
              end_local:
                type: string
                minLength: 5
                maxLength: 5
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
              timezone:
                type: string
                minLength: 3
                maxLength: 100
                description: IANA timezone identifier. The application must validate
                  it against its supported timezone database.
            required:
            - start_local
            - end_local
            - timezone
            additionalProperties: false
          - type: 'null'
        max_notifications_per_day:
          type: integer
          minimum: 0
          maximum: 5
        reminder_offsets_minutes:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 10080
          minItems: 0
          maxItems: 4
          uniqueItems: true
        sound_requested:
          type: boolean
        push_content_visibility:
          type: string
          enum:
          - generic
          - activity_title
      required:
      - version
      - enabled
      - channels
      - quiet_hours
      - max_notifications_per_day
      - reminder_offsets_minutes
      - sound_requested
      - push_content_visibility
      additionalProperties: false
      description: Delivery and sound remain subject to permission, browser/OS capability
        and user settings. This contract makes no guaranteed wake-up alarm or critical-alert
        promise.
    NotificationPreferencesUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        channels:
          type: array
          items:
            type: string
            enum:
            - in_app
            - email
            - push
          minItems: 0
          maxItems: 3
          uniqueItems: true
        quiet_hours:
          anyOf:
          - type: object
            properties:
              start_local:
                type: string
                minLength: 5
                maxLength: 5
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
              end_local:
                type: string
                minLength: 5
                maxLength: 5
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
              timezone:
                type: string
                minLength: 3
                maxLength: 100
                description: IANA timezone identifier. The application must validate
                  it against its supported timezone database.
            required:
            - start_local
            - end_local
            - timezone
            additionalProperties: false
          - type: 'null'
        max_notifications_per_day:
          type: integer
          minimum: 0
          maximum: 5
        reminder_offsets_minutes:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 10080
          minItems: 0
          maxItems: 4
          uniqueItems: true
        sound_requested:
          type: boolean
        push_content_visibility:
          type: string
          enum:
          - generic
          - activity_title
      required:
      - enabled
      - channels
      - quiet_hours
      - max_notifications_per_day
      - reminder_offsets_minutes
      - sound_requested
      - push_content_visibility
      additionalProperties: false
    CatalogReviewRequest:
      type: object
      properties:
        expected_resource_version_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        decision:
          type: string
          enum:
          - approve
          - reject
          - quarantine
          - retire
        rationale:
          type: string
          minLength: 1
          maxLength: 3000
        evidence:
          type: array
          items:
            type: object
            properties:
              evidence_id:
                type: string
                minLength: 3
                maxLength: 128
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
              claim:
                type: string
                minLength: 1
                maxLength: 1000
              kind:
                type: string
                enum:
                - institutional_identity
                - author_expertise
                - peer_review
                - field_usage
                - course_reviews
                - syllabus_review
                - other
              source_url:
                type: string
                minLength: 8
                maxLength: 2048
                format: uri
                pattern: ^https://
              accessed_at:
                type: string
                minLength: 20
                maxLength: 40
                format: date-time
              notes:
                type: string
                minLength: 0
                maxLength: 2000
            required:
            - evidence_id
            - claim
            - kind
            - source_url
            - accessed_at
            - notes
            additionalProperties: false
          minItems: 1
          maxItems: 30
      required:
      - expected_resource_version_id
      - decision
      - rationale
      - evidence
      additionalProperties: false
      description: Curator identity comes from authorization. A decision creates a
        new resource version and changes future eligibility; existing curriculum history
        is preserved. Approving eligibility does not automatically grant content ingestion
        rights.
    UsageRecord:
      type: object
      properties:
        generation_job_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        inference_mode:
          type: string
          enum:
          - hosted
          - byok
        provider_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        model_id:
          type: string
          minLength: 1
          maxLength: 150
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cost:
          anyOf:
          - type: object
            properties:
              currency:
                type: string
                minLength: 3
                maxLength: 3
                pattern: ^[A-Z]{3}$
              amount_minor_units:
                type: integer
                minimum: 0
                maximum: 1000000000000
            required:
            - currency
            - amount_minor_units
            additionalProperties: false
            description: Currency uses an ISO 4217 code; integer amounts use that
              currency’s minor unit. Currency validation and supported minor-unit
              precision are application rules.
          - type: 'null'
        cost_basis:
          type: string
          enum:
          - estimated_provider_cost
          - provider_reported_cost
          - platform_billed
          - unknown
        recorded_at:
          type: string
          minLength: 20
          maxLength: 40
          format: date-time
      required:
      - generation_job_id
      - inference_mode
      - provider_id
      - model_id
      - input_tokens
      - output_tokens
      - cost
      - cost_basis
      - recorded_at
      additionalProperties: false
    LedgerEntry:
      type: object
      properties:
        entry_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        kind:
          type: string
          enum:
          - reservation
          - settlement
          - release
          - credit
        direction:
          type: string
          enum:
          - debit
          - credit
          - hold
          - release
        amount:
          type: object
          properties:
            currency:
              type: string
              minLength: 3
              maxLength: 3
              pattern: ^[A-Z]{3}$
            amount_minor_units:
              type: integer
              minimum: 0
              maximum: 1000000000000
          required:
          - currency
          - amount_minor_units
          additionalProperties: false
          description: Currency uses an ISO 4217 code; integer amounts use that currency’s
            minor unit. Currency validation and supported minor-unit precision are
            application rules.
        generation_job_id:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          - type: 'null'
        reservation_id:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          - type: 'null'
        created_at:
          type: string
          minLength: 20
          maxLength: 40
          format: date-time
      required:
      - entry_id
      - kind
      - direction
      - amount
      - generation_job_id
      - reservation_id
      - created_at
      additionalProperties: false
      description: Read-only platform inference ledger. External BYOK-provider, material
        and compute charges are not represented as platform charges.
    UsagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsageRecord'
          minItems: 0
          maxItems: 100
        next_cursor:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 500
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    LedgerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
          minItems: 0
          maxItems: 100
        next_cursor:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 500
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    Proficiency:
      $ref: ./proficiency.schema.json
    PublicCurriculum:
      $ref: ./public-curriculum.schema.json
    AdaptationProposal:
      $ref: ./adaptation-proposal.schema.json
    CredentialRotate:
      type: object
      properties:
        api_key:
          type: string
          minLength: 8
          maxLength: 16384
          writeOnly: true
        expected_credential_version_ref:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
      required:
      - api_key
      - expected_credential_version_ref
      additionalProperties: false
    DiagnosticStartRequest:
      type: object
      properties:
        topic_ids:
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          minItems: 1
          maxItems: 20
          uniqueItems: true
        target_objective_version_ids:
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          minItems: 1
          maxItems: 100
          uniqueItems: true
        maximum_minutes:
          type: integer
          minimum: 1
          maximum: 30
          description: Sampling and learner-effort target in minutes, not an enforced
            response deadline or speed-based skill measure. Reaching it cannot fail
            or lock unanswered work. Pause/resume and stop behavior follows the current
            specification.
        language:
          type: string
          minLength: 2
          maxLength: 35
      required:
      - topic_ids
      - target_objective_version_ids
      - maximum_minutes
      - language
      additionalProperties: false
      description: The 1–30 minute input bound is a configurable initial sampling/effort
        target, not a scientifically validated test duration. Formative diagnostics
        do not impose a response deadline. Technical session expiry remains distinct
        and cannot create low-proficiency evidence.
    DiagnosticSession:
      type: object
      properties:
        diagnostic_session_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        state:
          type: string
          enum:
          - active
          - completed
          - stopped
          - expired
        target_objective_version_ids:
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          minItems: 1
          maxItems: 100
          uniqueItems: true
        assessed_objective_version_ids:
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          minItems: 0
          maxItems: 100
          uniqueItems: true
        unassessed_objective_version_ids:
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          minItems: 0
          maxItems: 100
          uniqueItems: true
        current_assessment_id:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          - type: 'null'
        policy_version:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        started_at:
          type: string
          minLength: 20
          maxLength: 40
          format: date-time
        expires_at:
          type: string
          minLength: 20
          maxLength: 40
          format: date-time
          description: Technical session lease expiry, not the sampling effort target
            or a speed score. Do not grade unanswered work at expiry; preserve submitted
            observations and offer an explained new reviewed session when needed.
        proficiency_snapshot_ref:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          - type: 'null'
        stop_reason:
          anyOf:
          - type: string
            enum:
            - coverage_complete
            - time_budget
            - learner_stopped
            - no_reviewed_items
          - type: 'null'
          description: time_budget names the end of the chosen sample or further item
            selection at the effort target when stopping is selected; it never means
            an answer became wrong or a response was locked by a speed deadline. learner_stopped
            is an explicit early stop. Technical lease expiry is represented by state=expired
            and does not establish low proficiency.
      required:
      - diagnostic_session_id
      - state
      - target_objective_version_ids
      - assessed_objective_version_ids
      - unassessed_objective_version_ids
      - current_assessment_id
      - policy_version
      - started_at
      - expires_at
      - proficiency_snapshot_ref
      - stop_reason
      additionalProperties: false
    DiagnosticAttemptRequest:
      type: object
      properties:
        attempt_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        assessment_version_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentAnswer'
          minItems: 1
          maxItems: 100
        declared_assistance:
          type: string
          enum:
          - none
          - hints
          - solution_viewed
          - ai
          - human
          - mixed
          - unknown
        client_elapsed_seconds:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 86400
          - type: 'null'
        assessment_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
      required:
      - attempt_id
      - assessment_version_id
      - answers
      - declared_assistance
      - client_elapsed_seconds
      - assessment_id
      additionalProperties: false
      description: Server verifies the assessment was delivered to this owned diagnostic
        session, not exposed previously beyond allowed conditions, and belongs to
        its reviewed policy. Client cannot submit a score or proficiency state.
    AdaptationPreviewRequest:
      type: object
      properties:
        base_revision_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        candidate_revision_id:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          - type: 'null'
        proficiency_snapshot_ref:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        base_schedule_revision_id:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          - type: 'null'
      required:
      - base_revision_id
      - candidate_revision_id
      - proficiency_snapshot_ref
      - base_schedule_revision_id
      additionalProperties: false
      description: Use an owned generated candidate, or null to request supported
        deterministic changes without inference. If new AI generation is needed, return
        generation_required and use the normal quoted generation/regeneration flow
        first.
    AdaptationAcceptRequest:
      type: object
      properties:
        expected_base_revision_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        expected_proficiency_snapshot_ref:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        expected_proposal_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        expected_base_schedule_revision_id:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          - type: 'null'
      required:
      - expected_base_revision_id
      - expected_proficiency_snapshot_ref
      - expected_proposal_sha256
      - expected_base_schedule_revision_id
      additionalProperties: false
    PublicationPreviewRequest:
      type: object
      properties:
        curriculum_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        curriculum_revision_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        publication_id:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          - type: 'null'
        base_publication_revision_id:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          - type: 'null'
        title:
          type: string
          minLength: 1
          maxLength: 160
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        audience_summary:
          type: string
          minLength: 1
          maxLength: 2000
        visibility:
          type: string
          enum:
          - public
          - unlisted
        publication_terms_policy_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
      required:
      - curriculum_id
      - curriculum_revision_id
      - publication_id
      - base_publication_revision_id
      - title
      - summary
      - audience_summary
      - visibility
      - publication_terms_policy_id
      additionalProperties: false
      allOf:
      - if:
          properties:
            publication_id:
              type: 'null'
          required:
          - publication_id
        then:
          properties:
            base_publication_revision_id:
              type: 'null'
        else:
          properties:
            base_publication_revision_id:
              type: string
              minLength: 3
              maxLength: 128
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
    PublicationPreview:
      type: object
      properties:
        preview_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        expires_at:
          type: string
          minLength: 20
          maxLength: 40
          format: date-time
        content_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        visibility:
          type: string
          enum:
          - public
          - unlisted
        public_content:
          $ref: ./public-curriculum.schema.json#/$defs/publicContent
        publication_terms_policy_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        warnings:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 2000
          minItems: 0
          maxItems: 100
        publisher:
          type: object
          properties:
            public_author_id:
              type: string
              minLength: 3
              maxLength: 128
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
            display_name:
              type: string
              minLength: 1
              maxLength: 100
          required:
          - public_author_id
          - display_name
          additionalProperties: false
        publication_terms:
          type: object
          properties:
            policy_id:
              type: string
              minLength: 3
              maxLength: 128
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
            content_license_id:
              type: string
              minLength: 3
              maxLength: 128
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
            rights_scope:
              const: eligible_original_annotations_and_structure
            attribution:
              type: string
              minLength: 1
              maxLength: 2000
            third_party_materials_excluded:
              const: true
          required:
          - policy_id
          - content_license_id
          - rights_scope
          - attribution
          - third_party_materials_excluded
          additionalProperties: false
        origin:
          anyOf:
          - type: object
            properties:
              publication_id:
                type: string
                minLength: 3
                maxLength: 128
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
              publication_revision_id:
                type: string
                minLength: 3
                maxLength: 128
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
              attribution:
                type: string
                minLength: 1
                maxLength: 1000
            required:
            - publication_id
            - publication_revision_id
            - attribution
            additionalProperties: false
          - type: 'null'
        preview_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
      required:
      - preview_id
      - expires_at
      - content_sha256
      - visibility
      - public_content
      - publication_terms_policy_id
      - warnings
      - publisher
      - publication_terms
      - origin
      - preview_sha256
      additionalProperties: false
      description: 'Exact public content, publisher identity, attribution, origin
        and legal terms to review. preview_sha256 hashes the JCS envelope {content:
        public_content, publisher, publication_terms, origin, visibility}; content_sha256
        hashes public_content only. Server stores additional owner/source/base-version
        bindings with the preview.'
    PublicationConfirmRequest:
      type: object
      properties:
        preview_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        publication_terms_policy_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        accept_publication_terms:
          const: true
        expected_preview_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
      required:
      - preview_id
      - publication_terms_policy_id
      - accept_publication_terms
      - expected_preview_sha256
      additionalProperties: false
    PublicationView:
      type: object
      properties:
        snapshot:
          $ref: '#/components/schemas/PublicCurriculum'
        visibility:
          type: string
          enum:
          - public
          - unlisted
        upvote_count:
          type: integer
          minimum: 0
          maximum: 1000000000
        educational_review_status:
          type: string
          enum:
          - community_unreviewed
          - revision_reviewed
        review_record_id:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          - type: 'null'
        resource_overlays:
          type: array
          items:
            type: object
            properties:
              resource_version_id:
                type: string
                minLength: 3
                maxLength: 128
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
              availability:
                type: string
                enum:
                - available
                - unavailable
                - unknown
                - restricted
              access_summary:
                type: string
                minLength: 1
                maxLength: 1000
              checked_at:
                type: string
                minLength: 20
                maxLength: 40
                format: date-time
            required:
            - resource_version_id
            - availability
            - access_summary
            - checked_at
            additionalProperties: false
          minItems: 0
          maxItems: 400
      required:
      - snapshot
      - visibility
      - upvote_count
      - educational_review_status
      - review_record_id
      - resource_overlays
      additionalProperties: false
      description: Only serve when lifecycle and rights overlays permit. Public body
        has no current-viewer vote or personal access. Review badges require an attributable
        review of this exact revision.
      allOf:
      - if:
          properties:
            educational_review_status:
              const: revision_reviewed
          required:
          - educational_review_status
        then:
          properties:
            review_record_id:
              type: string
              minLength: 3
              maxLength: 128
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        else:
          properties:
            review_record_id:
              type: 'null'
    PublicationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicationView'
          minItems: 0
          maxItems: 100
        next_cursor:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 500
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    VoteState:
      type: object
      properties:
        publication_revision_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        has_upvoted:
          type: boolean
        upvote_count:
          type: integer
          minimum: 0
          maximum: 1000000000
      required:
      - publication_revision_id
      - has_upvoted
      - upvote_count
      additionalProperties: false
    PublicationReportRequest:
      type: object
      properties:
        reason:
          type: string
          enum:
          - incorrect_information
          - broken_resource
          - private_data
          - rights
          - spam
          - misleading_credential
          - unsafe_link
          - other
        details:
          type: string
          minLength: 1
          maxLength: 3000
        publication_revision_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
      required:
      - reason
      - details
      - publication_revision_id
      additionalProperties: false
    PublicationReportReceipt:
      type: object
      properties:
        report_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        received_at:
          type: string
          minLength: 20
          maxLength: 40
          format: date-time
      required:
      - report_id
      - received_at
      additionalProperties: false
    ModerationRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - quarantine
          - restore
          - dismiss_report
        reason:
          type: string
          minLength: 1
          maxLength: 3000
        report_ids:
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          minItems: 0
          maxItems: 100
          uniqueItems: true
      required:
      - action
      - reason
      - report_ids
      additionalProperties: false
    ModerationReceipt:
      type: object
      properties:
        action_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        publication_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        state:
          type: string
          enum:
          - active
          - quarantined
          - withdrawn
        recorded_at:
          type: string
          minLength: 20
          maxLength: 40
          format: date-time
      required:
      - action_id
      - publication_id
      - state
      - recorded_at
      additionalProperties: false
    AdoptionRequest:
      oneOf:
      - type: object
        properties:
          expected_content_sha256:
            type: string
            minLength: 64
            maxLength: 64
            pattern: ^[a-f0-9]{64}$
          execution:
            const: deterministic
          planning:
            allOf:
            - $ref: ./generation-request.schema.json#/$defs/planningRequest
            - properties:
                template_origin:
                  type: object
        required:
        - expected_content_sha256
        - execution
        - planning
        additionalProperties: false
      - type: object
        properties:
          expected_content_sha256:
            type: string
            minLength: 64
            maxLength: 64
            pattern: ^[a-f0-9]{64}$
          request:
            allOf:
            - $ref: '#/components/schemas/GenerationRequest'
            - properties:
                template_origin:
                  type: object
          execution:
            const: generate
          quote_id:
            type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          reservation_id:
            type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        required:
        - expected_content_sha256
        - request
        - execution
        additionalProperties: false
        allOf:
        - if:
            properties:
              request:
                properties:
                  inference:
                    properties:
                      mode:
                        const: hosted
                    required:
                    - mode
                required:
                - inference
            required:
            - request
          then:
            required:
            - quote_id
            - reservation_id
          else:
            not:
              required:
              - reservation_id
        description: Adoption creates a private draft with no inherited evidence/votes/spend
          authorization. Deterministic mode may not call a model; fail generation_required
          if necessary. Generated adoption follows the same request-bound quote/reservation/BYOK
          rules as generation.
      description: Choose planning-only deterministic adoption with no credential/inference
        budget, or fully authorized generation. template_origin must match the path
        IDs and expected content hash. The normal quote fingerprint therefore binds
        the selected public template as well as learner constraints.
    PublicationManagement:
      type: object
      properties:
        publication_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        state:
          type: string
          enum:
          - active
          - quarantined
          - withdrawn
        visibility:
          type: string
          enum:
          - public
          - unlisted
        current_publication_revision_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        management_version_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        updated_at:
          type: string
          format: date-time
      required:
      - publication_id
      - state
      - visibility
      - current_publication_revision_id
      - management_version_id
      - updated_at
      additionalProperties: false
      description: Owner-only authoring/lifecycle metadata without quarantined content
        or vote counts. Readable after withdrawal while the owning account is active.
    OwnedPublicationSummary:
      type: object
      properties:
        publication_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        state:
          type: string
          enum:
          - active
          - quarantined
          - withdrawn
        visibility:
          type: string
          enum:
          - public
          - unlisted
        current_publication_revision_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        management_version_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        updated_at:
          type: string
          format: date-time
        display_title:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 300
          - type: 'null'
        current_revision_upvote_count: &id002
          anyOf:
          - type: integer
            minimum: 0
            maximum: 1000000000
          - type: 'null'
      required:
      - publication_id
      - state
      - visibility
      - current_publication_revision_id
      - management_version_id
      - updated_at
      - display_title
      - current_revision_upvote_count
      additionalProperties: false
      description: Owner-only summary across active, quarantined and withdrawn records.
        Title/count may be withheld as null. No content body, private learning data,
        reporter identity or mutation ETag. Use the management endpoint for current
        mutation preconditions.
    OwnedPublicationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OwnedPublicationSummary'
          minItems: 0
          maxItems: 100
        next_cursor:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 500
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    OwnedPublicationRevisionSummary:
      type: object
      properties:
        publication_revision_id: *id001
        revision_number:
          type: integer
          minimum: 1
          maximum: 1000000
        published_at:
          type: string
          format: date-time
        content_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        public_readable:
          type: boolean
        upvote_count: *id002
      required:
      - publication_revision_id
      - revision_number
      - published_at
      - content_sha256
      - public_readable
      - upvote_count
      additionalProperties: false
      description: Owner-only immutable-revision metadata plus current public-readability/count
        observations. No snapshot body or private evidence. Public readability is
        rechecked on each actual read; counts never transfer between revisions.
    OwnedPublicationRevisionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OwnedPublicationRevisionSummary'
          minItems: 0
          maxItems: 100
        next_cursor:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 500
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
  responses:
    '400':
      description: Malformed request or unsupported schema version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: Authentication missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '402':
      description: Insufficient hosted balance or an authorization ceiling cannot
        be reserved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      description: Authenticated caller lacks the required role or entitlement.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: Resource is absent or not visible to this account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: Idempotency fingerprint conflict, invalid lifecycle transition
        or other state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '412':
      description: If-Match does not match the current version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '422':
      description: Well-formed request violates domain constraints, resource eligibility
        or time/budget feasibility.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '428':
      description: Required If-Match header is absent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '429':
      description: Application rate limit reached; Retry-After is supplied when available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Delay in seconds before retry, when known.
          schema:
            type: integer
            minimum: 1
    '500':
      description: Unexpected internal failure; sensitive context is redacted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '503':
      description: A required service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Delay in seconds before retry, when known.
          schema:
            type: integer
            minimum: 1
    '504':
      description: Synchronous dependency timeout. Async generation failures appear
        in job status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
