components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Authenticated session access token. Issuer/session lifecycle is
        a separate integration contract. Resolve account and roles server-side; never
        trust account IDs supplied by clients.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Scoped to authenticated account, HTTP method and route. Reusing
        a key with a different normalized request returns 409. Same requests replay
        the original operation result, not another charge or event.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]{8,128}$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag returned by the most recent representation. Missing is 428;
        stale is 412.
      schema:
        type: string
        minLength: 1
        maxLength: 150
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 500
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  schemas:
    Identifier:
      type: string
      minLength: 3
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
    Money:
      type: object
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
        amount_minor_units:
          type: integer
          minimum: 0
          maximum: 1000000000000
      required:
      - currency
      - amount_minor_units
      additionalProperties: false
      description: Currency uses an ISO 4217 code; integer amounts use that currency’s
        minor unit. Currency validation and supported minor-unit precision are application
        rules.
    Curriculum:
      $ref: ./curriculum.schema.json
    Resource:
      $ref: ./resource.schema.json
    GenerationRequest:
      $ref: ./generation-request.schema.json
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - invalid_request
              - unauthorized
              - forbidden
              - not_found
              - conflict
              - idempotency_conflict
              - precondition_failed
              - precondition_required
              - unsupported_schema_version
              - ineligible_resources
              - insufficient_catalog_coverage
              - budget_exceeded
              - insufficient_balance
              - quote_expired
              - reservation_expired
              - credential_invalid
              - provider_rate_limited
              - provider_unavailable
              - generation_timeout
              - invalid_model_output
              - assessment_unavailable
              - rate_limited
              - internal_error
              - temporarily_unavailable
              - credential_version_changed
              - generation_required
              - diagnostic_unavailable
              - invalid_assessment_context
              - evidence_changed
              - publication_preview_expired
              - publication_terms_changed
              - publication_withdrawn
              - publication_not_owned
              - self_vote_forbidden
              - account_not_verified
              - duplicate_publication_revision
            message:
              type: string
              minLength: 1
              maxLength: 500
            request_id:
              type: string
              minLength: 3
              maxLength: 128
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
            retryable:
              type: boolean
            field_errors:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                    minLength: 1
                    maxLength: 300
                  code:
                    type: string
                    minLength: 1
                    maxLength: 80
                  message:
                    type: string
                    minLength: 1
                    maxLength: 300
                required:
                - path
                - code
                - message
                additionalProperties: false
              minItems: 0
              maxItems: 30
          required:
          - code
          - message
          - request_id
          - retryable
          - field_errors
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    GenerationJob:
      type: object
      properties:
        generation_job_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
        state:
          type: string
          enum:
          - queued
          - running
          - validating
          - succeeded
          - failed
          - cancel_requested
          - cancelled
        created_at:
          type: string
          minLength: 20
          maxLength: 40
          format: date-time
        started_at:
          anyOf:
          - type: string
            minLength: 20
            maxLength: 40
            format: date-time
          - type: 'null'
        finished_at:
          anyOf:
          - type: string
            minLength: 20
            maxLength: 40
            format: date-time
          - type: 'null'
        curriculum_id:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          - type: 'null'
        curriculum_revision_id:
          anyOf:
          - type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$
          - type: 'null'
        failure:
          anyOf:
          - type: object
            properties:
              code:
                type: string
                minLength: 1
                maxLength: 80
              message:
                type: string
                minLength: 1
                maxLength: 500
              retryable:
                type: boolean
            required:
            - code
            - message
            - retryable
            additionalProperties: false
          - type: 'null'
        usage_reconciliation_state:
          type: string
          enum:
          - not_started
          - pending
          - settled
          - released
      required:
      - generation_job_id
      - state
      - created_at
      - started_at
      - finished_at
      - curriculum_id
      - curriculum_revision_id
      - failure
      - usage_reconciliation_state
      additionalProperties: false
    UsageQuote:
      type: object
      properties:
        quote_id:
          type: string
          minLength: 3
          maxLength: 128
